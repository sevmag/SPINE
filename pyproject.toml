[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "spine"
version = "0.0.1"
description = "Self-supervised Pretraining In Neutrino Experiments -- extensible SSL pretraining of transformers on neutrino-telescope data."
readme = "README.md"
# Pinned to the runtime env that provides the DeepIce backbone (graphnet on
# torch 2.6 / Python 3.10.20). Bumping this is an env decision, not a SPINE one:
# encoders produced here must load in that same env on the finetuning side.
requires-python = ">=3.10"
dependencies = [
    "torch>=2.6",
    "pytorch-lightning>=2.5",  # standalone PL (env ships 2.6.x); NOT the unified `lightning`
    "numpy",
    "scipy",     # cKDTree: pulse -> sensor matching in the CURTAIN sampler
    "pandas",
    "pyarrow",   # selection parquets
]

[project.optional-dependencies]
lmdb = ["lmdb"]
dev = ["ruff", "pre-commit"]
# Hydra/OmegaConf are used only by the example launcher (examples/train_curtain.py
# + configs/), NOT by the core library -- src/spine/ stays config-framework-free.
hydra = ["hydra-core>=1.2", "omegaconf>=2.2"]

# The core (`src/spine/`) has no graphnet dependency. The reference DeepIce
# backbone lives in `examples/deepice_backbone.py`, which imports graphnet lazily
# (env-provided editable/local checkout, not on PyPI) and errors with a clear
# message if it is absent. So graphnet is intentionally NOT listed here.

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 88
target-version = "py310"

[tool.ruff.lint]
# E/F/W: pycodestyle+pyflakes; I: import order; B: bugbear bug patterns;
# UP: py310 idioms; D: docstring presence and form (pep257 prose style).
select = ["E", "F", "W", "I", "B", "UP", "D"]
# magic methods and __init__ need no own docstrings -- construction is
# documented on the class
ignore = ["D105", "D107"]

[tool.ruff.lint.pydocstyle]
convention = "pep257"
