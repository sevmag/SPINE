# The CURTAIN pretrain task -- a self-contained plugin config that pulls in its
# own objectives. The launcher injects the runtime geo + scaler and
# recursive-instantiates the rest. Sampler knobs (q_lo/q_hi,
# pos_k, neg_anchor, rand_neg_frac, min_visible, min_future, resample_tries)
# are task arguments with their defaults in CurtainTask -- override like
# task.q_lo=0.5.
defaults:
  - objectives: v1
  - _self_

_target_: spine.pretrain.curtain.task.CurtainTask
max_pulses: 768
center_time: true
dt_scale: 500.0
pos_k: null        # STANDARD: uncapped -- query every future-lit sensor (set 32 to cap)
cap_whole_event: true    # STANDARD: subsample whole event to max_pulses before the split
q_lo: 0.0          # STANDARD: sample the cutoff across the FULL event time range
q_hi: 1.0          # (T = quantile(pt, U(q_lo,q_hi)); old middle-window was 0.3/0.7)
