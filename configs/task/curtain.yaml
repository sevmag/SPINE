# The CURTAIN pretrain task -- a self-contained plugin config that pulls in its
# own objectives. The launcher injects the runtime geo + scaler and
# recursive-instantiates the rest. Sampler knobs (q_lo/q_hi,
# pos_k, neg_anchor, rand_neg_frac, min_visible, min_future, resample_tries)
# are task arguments with their defaults in CurtainTask -- override like
# task.q_lo=0.5.
defaults:
  - objectives: v1
  - _self_

_target_: spine.pretrain.curtain.task.CurtainTask
max_pulses: 768
center_time: true
dt_scale: 500.0
pos_k: 32          # max positives/event; null = uncapped (query every future-lit sensor)
cap_whole_event: false   # true = subsample whole event to max_pulses before the split (bounds queries)
q_lo: 0.3          # cutoff-quantile window lower bound (T = quantile(pt, U(q_lo,q_hi)))
q_hi: 0.7          # widen to q_lo=0/q_hi=1 to sample the cutoff across the full time range
