# graphnet DeepIce -- the spine_graphnet integration package (needs graphnet
# in the env and `pip install -e .`)
_target_: spine_graphnet.deepice_backbone.DeepIceBackbone
d_model: 128
depth: 3
head_size: 16
depth_rel: 2
n_rel: 2
seq_length: 192
# run the plain blocks jagged (no padding compute); rel blocks stay padded
use_nested_attention: false
