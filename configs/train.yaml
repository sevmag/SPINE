# SPINE CURTAIN pretraining -- compose a run from config groups. Instantiated by
# examples/train_curtain.py (it puts src/ and examples/ on sys.path so every
# _target_ resolves). Override on the CLI, e.g.:
#   python train_curtain.py geo=/.../geo.npz out=/.../ckpt.pth \
#       data.db=/.../hexagon.db data.train_selection=tr.parquet \
#       data.val_selection=va.parquet objectives=v2 trainer.devices=4
defaults:
  - backbone: deepice
  - sampler: default
  - objectives: v1
  - trainer: default
  - data: sqlite
  - _self_

geo: ???          # geometry .npz (required)
out: ???          # transfer-checkpoint output path (required)

scaler:
  _target_: spine.data.scaling.HexagonScaler

task:
  _target_: spine.pretext.curtain.task.CurtainTask
  max_pulses: 768
  center_time: true
  dt_scale: 500.0

hydra:
  job:
    chdir: false   # keep cwd so relative geo/db/selection paths resolve
