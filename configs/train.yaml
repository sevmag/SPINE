# SPINE CURTAIN pretraining -- compose a run from config groups. Instantiated by
# examples/train_curtain.py (it puts src/ and examples/ on sys.path so every
# _target_ resolves). Override on the CLI, e.g.:
#   python train_curtain.py geo=/.../geo.npz out=/.../ckpt.pth \
#       data.db=/.../hexagon.db data.train_selection=tr.parquet \
#       data.val_selection=va.parquet task/objectives=v2 trainer.devices=4
defaults:
  - backbone: deepice
  - task: curtain
  - optimizer: adam
  - scheduler: plateau
  - trainer: default
  - callbacks: none
  - data: sqlite
  - _self_

geo: ???          # geometry .npz (required)
geo_sensor_key: ???    # per-row sensor-key array in the geometry asset
                       # (e.g. pmt_id) that the reader's sensor_key matches
out: ???          # transfer-checkpoint output path (required)

# Lightning lr_scheduler metadata (monitor/interval/frequency); null uses
# SSLModule's default: epoch-level plateau scheduling on the val loss
scheduler_config: null

# feature scaling is detector-specific (not task-specific); the task is handed
# this at instantiate time
scaler:
  _target_: spine.data.scaling.HexagonScaler

hydra:
  job:
    chdir: false   # keep cwd so relative geo/db/selection paths resolve
